tcm_api.movie:
  path: '/movie/{id}'
  defaults:
    _controller: '\Drupal\tcm_api\Entity\Movie::content'
  requirements:
    _permission: 'access content'
    id: ^[0-9_]+

tcm_api.all_movies:
  path: '/movies'
  defaults:
    _controller: '\Drupal\tcm_api\Controller\MoviesController::moviesPage'
  requirements:
    _permission: 'access content'